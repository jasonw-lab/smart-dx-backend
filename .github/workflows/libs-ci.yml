name: Libs CI

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'apps/backend/libs/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/libs-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/libs/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/libs-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build libs
        run: |
          mvn -f apps/backend/pom.xml clean verify \
            -pl smart-be-core,smart-be-security,smart-be-tenant,smart-be-redis,smart-be-opensearch,smart-be-observability \
            -am \
            --batch-mode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libs-test-results
          path: apps/backend/libs/**/target/surefire-reports/
          retention-days: 7
