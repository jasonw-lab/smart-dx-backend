name: Property BE CI

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'apps/backend/services/property-be/**'
      - 'apps/backend/libs/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/property-be-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/services/property-be/**'
      - 'apps/backend/libs/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/property-be-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: property_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test property-be
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          mvn -f apps/backend/pom.xml clean verify \
            -pl property-be \
            -am \
            --batch-mode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-be-test-results
          path: apps/backend/services/property-be/target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-be-jar
          path: apps/backend/services/property-be/target/property-be.jar
          retention-days: 7
