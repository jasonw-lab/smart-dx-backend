server:
  port: 8080

# Dotenv configuration - load .env from current dir, parent dir, or apps/backend/app/
env:
  location: file:.env,file:../.env,file:apps/backend/app/.env
  ignore-missing: true

spring:
  application:
    name: smart-dx-app
  main:
    lazy-initialization: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database: 統合デプロイ (modular monolith) では全ドメイン (property/system/retail) が
  # この単一 datasource = smart_dx_db を使用する。retail_db は retail-be 単体起動 (DEMO) 専用。
  # retail_* テーブルは retail Flyway (smartdx.flyway.retail.enabled=true) が smart_dx_db に
  # 自動作成する (ADR-006 追記参照)。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_dx_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 3600000

  # Flyway: sys_*/property_* は docs/db (および各正本SQL) で直接管理のため無効。
  # retail のみ有効: retail_* テーブルの DDL 正本は
  # services/retail-be/src/main/resources/db/migration/retail/ であり、
  # 統合デプロイでは smart_dx_db に対して自動適用される (E2E と同一機構)。
  # FlywayAutoConfiguration は SmartDxApplication で除外済み (各ドメインの FlywayConfig を使用)。

# Domain-specific Flyway toggles
smartdx:
  flyway:
    retail:
      enabled: ${SMARTDX_FLYWAY_RETAIL_ENABLED:true}

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Multi-tenant configuration
tenant:
  enabled: true
  column: tenant_id
  default-tenant-id: 1
  force-default: false
  header-name: X-Tenant-Id
  ignore-tables:
    - sys_tenant
    - sys_config
    - sys_menu
    - sys_role_menu
    - sys_tenant_menu
    - sys_tenant_plan
    - sys_tenant_plan_menu
    - gen_table
    - gen_table_column
    # FIXME(指摘11): retail_sales_detail は tenant_id カラムを持つ業務テーブルだが
    # フィルタ除外されている (親 retail_sales はフィルタ対象で非対称)。
    # 除外解除の影響検証は別タスク (docs/.review/review_0715_architecture.claude.md 指摘11)
    - retail_sales_detail
    # Flyway を有効化した場合用 (現在は未作成のテーブル、サンプルとして保持)
    - flyway_schema_history
    - flyway_schema_history_property
    - flyway_schema_history_system
    - flyway_schema_history_retail

# Security (shared JWT secret across all domains)
security:
  session:
    type: jwt
    access-token-time-to-live: 86400
    refresh-token-time-to-live: 604800
    jwt:
      # デフォルト値なし: 未設定の場合 JwtTokenManager が起動時に fail-fast する。
      # ローカル開発用のデフォルトは dev プロファイル (本ファイル末尾) でのみ定義。
      secret-key: ${JWT_SECRET_KEY:}
  ignore-urls:
    - /api/v1/auth/**
    - /api/auth/login
    - /api/auth/refresh
    - /api/captcha/**
    - /api/v1/health
    - /api/v1/retail/heartbeat
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    # actuator は health のみ無認証。metrics/prometheus は認証必須 (外部公開は nginx でも遮断)
    - /actuator/health
    - /actuator/health/**
  unsecured-urls:
    - /api/v1/auth/**
    - /api/v1/health
    - /api/v1/retail/heartbeat
    - /api/v1/properties/search
    - /api/v1/properties/*/similar
    # E2Eテスト設定: コントローラは dev/e2e/test プロファイル限定 (@Profile ホワイトリスト)。
    # 本番プロファイルではエンドポイント自体が存在しない (404)。
    - /api/v1/system/test-config
    - /actuator/health
    - /actuator/health/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /doc.html

# MinIO (property domain)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:property}

# OpenSearch (property domain)
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USER:}
  password: ${OPENSEARCH_PASSWORD:}

# Property Search OpenSearch (consumed by PropertyOpenSearchProperties)
property:
  search:
    opensearch:
      enabled: ${PROPERTY_SEARCH_OPENSEARCH_ENABLED:true}
      endpoint: ${PROPERTY_SEARCH_OPENSEARCH_ENDPOINT:${OPENSEARCH_SCHEME:http}://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}}

# Chatbot (property domain)
chatbot:
  llm:
    enabled: ${CHATBOT_LLM_ENABLED:true}
    provider: ${CHATBOT_LLM_PROVIDER:gemini}
    api-key: ${GOOGLE_AI_API_KEY:${CHATBOT_LLM_API_KEY:}}
    api-endpoint: ${CHATBOT_LLM_API_ENDPOINT:}
    model: ${CHATBOT_LLM_MODEL:gemini-2.5-flash}
    timeout-ms: ${CHATBOT_LLM_TIMEOUT_MS:5000}
    daily-limit: ${CHATBOT_LLM_DAILY_LIMIT:100}

# Captcha (system domain)
captcha:
  required: ${CAPTCHA_REQUIRED:false}
  width: 120
  height: 40
  code-length: 4
  expire-seconds: 300

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

# OpenAPI (Knife4j)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan:
    - com.smartdx.property.controller
    - com.smartdx.system.controller
    - com.smartdx.retail.controller
    - com.smartdx.retail.ai.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# Logging
logging:
  level:
    root: INFO
    com.smartdx: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{tenantId}] [%X{requestId}] %-5level %logger{36} - %msg%n"

---
# ローカル開発 (dev) 専用: JWT_SECRET_KEY 未設定でも起動できるようデフォルト鍵を提供する。
# この鍵は開発専用であり、本番系プロファイル (docker/prod) にはデフォルト値が無いため
# JWT_SECRET_KEY 未設定なら起動に失敗する (fail-fast)。
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    restart:
      enabled: true
      poll-interval: 500ms
      quiet-period: 200ms
      additional-paths:
        - ../services/retail-be/target/classes
        - ../services/system-be/target/classes
        - ../services/property-be/target/classes

security:
  session:
    jwt:
      secret-key: ${JWT_SECRET_KEY:smartdx-dev-only-secret-key-2024-must-be-at-least-256-bits-long}

---
# 本番系プロファイル (docker / prod): 起動時に全 Bean を初期化し、
# 設定不備を初回リクエスト時ではなく起動時に検出する。
spring:
  config:
    activate:
      on-profile: docker, prod
  main:
    lazy-initialization: false

logging:
  level:
    com.smartdx: INFO
