server:
  port: 0

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${E2E_MYSQL_HOST:localhost}:${E2E_MYSQL_PORT:3306}/${E2E_MYSQL_DATABASE:smart_dx_db}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&autoReconnect=true&allowMultiQueries=true
    username: ${E2E_MYSQL_USER:${MYSQL_USER:${MYSQL_USERNAME:root}}}
    password: ${E2E_MYSQL_PASSWORD:${MYSQL_PASSWORD:123456}}

  # Flyway: E2Eテストではチェックサム検証をスキップ、失敗したmigrationをrepair
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: false
    table: flyway_schema_history_property
    repair-on-migrate: true

  data:
    redis:
      database: ${E2E_REDIS_DATABASE:0}
      host: ${E2E_REDIS_HOST:localhost}
      port: ${E2E_REDIS_PORT:6379}
      password: ${E2E_REDIS_PASSWORD:${REDIS_PASSWORD:123456}}
      timeout: 10s

  cache:
    enabled: false
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: true
    caffeine:
      spec: initialCapacity=50,maximumSize=1000,expireAfterWrite=600s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: none
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

property:
  search:
    opensearch:
      enabled: ${E2E_PROPERTY_SEARCH_OPENSEARCH_ENABLED:true}
      endpoint: ${OPENSEARCH_URL:${E2E_PROPERTY_SEARCH_OPENSEARCH_ENDPOINT:http://localhost:9200}}
      published-index: ${E2E_PROPERTY_SEARCH_OPENSEARCH_PUBLISHED_INDEX:realty_published_listings}
      draft-index: ${E2E_PROPERTY_SEARCH_OPENSEARCH_DRAFT_INDEX:realty_draft_listings}
      connect-timeout: 2s
      request-timeout: 3s

security:
  session:
    type: jwt
    access-token-time-to-live: 7200
    refresh-token-time-to-live: 604800
    jwt:
      secret-key: ${E2E_JWT_SECRET:SecretKey012345678901234567890123456789012345678901234567890123456789}
    redis-token:
      allow-multi-login: true
  ignore-urls:
    - /api/v1/auth/login/**
    - /api/v1/auth/captcha
    - /api/v1/auth/sms/code
    - /api/v1/auth/refresh-token
    - /api/v1/wxma/auth/**
  unsecured-urls:
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /favicon.ico
    - /error

oss:
  type: minio
  minio:
    endpoint: ${E2E_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${E2E_MINIO_ACCESS_KEY:${MINIO_ROOT_USER:${MINIO_ACCESSKEY:minioadmin}}}
    secret-key: ${E2E_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:${MINIO_SECRETKEY:minioadmin}}}
    bucket-name: ${E2E_MINIO_BUCKET:property}
    custom-domain:

tenant:
  column: tenant_id
  ignore-tables:
    - sys_tenant
    - sys_tenant_plan
    - sys_tenant_plan_menu
    - sys_menu
    - sys_dict
    - sys_dict_item
    - sys_config
    - sys_test_config
    - gen_table
    - gen_table_column
    - flyway_schema_history_property

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

xxl:
  job:
    enabled: false

captcha:
  type: circle
  width: 120
  height: 40
  interfere-count: 2
  text-alpha: 0.8
  code:
    type: math
    length: 1
  font:
    name: SansSerif
    weight: 1
    size: 24
  expire-seconds: 120

# knife4j 接口文档配置（E2Eテスト用）
knife4j:
  enable: false
  production: true
