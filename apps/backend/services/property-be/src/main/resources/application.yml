server:
  port: 8081

spring:
  application:
    name: property-be
  main:
    lazy-initialization: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_dx_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 3600000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true
    table: flyway_schema_history_property

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartdx.property.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Multi-tenant configuration
tenant:
  enabled: true
  column: tenant_id
  default-tenant-id: 1
  force-default: false
  header-name: X-Tenant-Id
  ignore-tables:
    - sys_tenant
    - sys_config
    - gen_table
    - gen_table_column
    - flyway_schema_history_property

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # ブラウザからアクセス可能な MinIO エンドポイント。未設定時は endpoint と同じ。
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:property}

# Security
security:
  session:
    type: jwt
    access-token-time-to-live: 86400
    refresh-token-time-to-live: 604800
    jwt:
      secret-key: ${JWT_SECRET_KEY:smartdx-shared-secret-key-2024-must-be-at-least-256-bits-long}
  ignore-urls:
    - /api/auth/login
    - /api/auth/refresh
    - /api/captcha/**
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /actuator/**
    - /actuator/health
    - /actuator/health/**
  unsecured-urls:
    - /api/v1/properties/search
    - /api/v1/properties/*/similar
    - /actuator/health
    - /actuator/health/**

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# OpenSearch
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USER:}
  password: ${OPENSEARCH_PASSWORD:}

# Property Search OpenSearch (consumed by PropertyOpenSearchProperties)
property:
  search:
    opensearch:
      enabled: ${PROPERTY_SEARCH_OPENSEARCH_ENABLED:true}
      endpoint: ${PROPERTY_SEARCH_OPENSEARCH_ENDPOINT:${OPENSEARCH_SCHEME:http}://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}}

# Chatbot
chatbot:
  llm:
    enabled: ${CHATBOT_LLM_ENABLED:true}
    provider: ${CHATBOT_LLM_PROVIDER:gemini}
    api-key: ${GOOGLE_AI_API_KEY:${CHATBOT_LLM_API_KEY:}}
    api-endpoint: ${CHATBOT_LLM_API_ENDPOINT:}
    model: ${CHATBOT_LLM_MODEL:gemini-2.5-flash}
    timeout-ms: ${CHATBOT_LLM_TIMEOUT_MS:5000}
    daily-limit: ${CHATBOT_LLM_DAILY_LIMIT:100}

# Logging
logging:
  level:
    root: INFO
    com.smartdx.property: DEBUG
    com.smartdx.tenant: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{tenantId}] [%X{requestId}] %-5level %logger{36} - %msg%n"

# Knife4j OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
