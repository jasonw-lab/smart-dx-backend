server:
  port: 0

spring:
  application:
    name: retail-be-e2e

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${E2E_MYSQL_HOST:localhost}:${E2E_MYSQL_PORT:3306}/${E2E_MYSQL_DATABASE:smart_dx_db}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&autoReconnect=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${E2E_MYSQL_USER:root}
    password: ${E2E_MYSQL_PASSWORD:test123}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/retail
    table: flyway_schema_history_retail

  data:
    redis:
      database: ${E2E_REDIS_DATABASE:0}
      host: ${E2E_REDIS_HOST:localhost}
      port: ${E2E_REDIS_PORT:6379}
      password: ${E2E_REDIS_PASSWORD:}

# Disable Redisson auto-config in tests (use standard RedisTemplate)
redisson:
  enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

tenant:
  enabled: true
  column: tenant_id
  default-tenant-id: 1
  force-default: false
  ignore-tables:
    - retail_sales_detail
    - flyway_schema_history_retail

security:
  session:
    type: jwt
    access-token-time-to-live: 7200
    refresh-token-time-to-live: 604800
    jwt:
      secret-key: ${E2E_JWT_SECRET:SecretKey012345678901234567890123456789012345678901234567890123456789}
  ignore-urls:
    - /api/v1/auth/**
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /doc.html
    - /api/v1/retail/ai/alerts/priority
  unsecured-urls:
    - /api/v1/auth/**
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /doc.html
    - /api/v1/retail/ai/alerts/priority

captcha:
  required: false
  width: 120
  height: 40
  code-length: 4
  expire-seconds: 300

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

knife4j:
  enable: false
  production: true

logging:
  level:
    com.smartdx: DEBUG
    com.smartdx.tenant: DEBUG
