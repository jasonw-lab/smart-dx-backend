server:
  port: ${RETAIL_BE_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: retail-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${RETAIL_DB_NAME:retail_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_retail

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartdx.retail.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Multi-tenant Configuration (force-default mode for retail)
tenant:
  enabled: true
  column: tenant_id
  default-tenant-id: 1
  # force-default: All requests processed with default tenant ID
  # Set to false to enable multi-tenant mode with X-Tenant-ID header
  force-default: false
  ignore-tables:
    - retail_sales_detail
    - flyway_schema_history_retail

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.smartdx: DEBUG
    com.smartdx.tenant: DEBUG
    org.springframework.security: INFO

# OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.smartdx.retail.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

retail:
  ai:
    llm:
      enabled: ${RETAIL_AI_LLM_ENABLED:true}
      provider: ${RETAIL_AI_LLM_PROVIDER:gemini}
      api-key: ${GOOGLE_AI_API_KEY:}
      model: ${RETAIL_AI_LLM_MODEL:gemini-2.0-flash-001}
      timeout-ms: ${RETAIL_AI_LLM_TIMEOUT_MS:5000}
