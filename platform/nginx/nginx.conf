worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # 認証系エンドポイントのブルートフォース対策
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # Modular Monolith: Single upstream for all backend services
    # See: docs/adr/006-modular-monolith-deployment.md
    upstream smart-dx-be {
        server smart-dx-be:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Actuator: 外部公開は health のみ。metrics/prometheus 等の内部情報は
        # 外部へ出さない (スクレイピングは内部ネットワークから直接 8080 へ)。
        location /actuator/health {
            proxy_pass http://smart-dx-be/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /actuator/ {
            return 403;
        }

        # 認証系: レート制限を適用
        location ~ ^/api(/v1)?/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://smart-dx-be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # All API routing to unified backend
        location /api/ {
            proxy_pass http://smart-dx-be/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;

            # SSE support for streaming endpoints
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Swagger/OpenAPI
        location /swagger-ui/ {
            proxy_pass http://smart-dx-be/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass http://smart-dx-be/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /doc.html {
            proxy_pass http://smart-dx-be/doc.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webjars/ {
            proxy_pass http://smart-dx-be/webjars/;
            proxy_set_header Host $host;
        }

        # Default response
        location / {
            return 200 'Smart DX Backend';
            add_header Content-Type text/plain;
        }
    }
}
