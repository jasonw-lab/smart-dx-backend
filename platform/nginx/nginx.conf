worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Upstream definitions (Phase 2以降でコメント解除)
    # upstream property-be {
    #     server property-be:8080;
    # }

    # upstream retail-be {
    #     server retail-be:8080;
    # }

    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Property API routing (Phase 2で有効化)
        # location /api/property/ {
        #     proxy_pass http://property-be/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 30s;
        #     proxy_read_timeout 60s;
        # }

        # Retail API routing (Phase 3で有効化)
        # location /api/retail/ {
        #     proxy_pass http://retail-be/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 30s;
        #     proxy_read_timeout 60s;
        # }

        # Default response
        location / {
            return 200 'Smart DX Backend - Phase 1';
            add_header Content-Type text/plain;
        }
    }
}
